[project]
name = "usa-real-estate-ml-econ"
version = "0.1.0"
description = "USA Real Estate Machine Learning Econometrics Project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas",
  "pyarrow",
  "scikit-learn",
  "matplotlib",
  "seaborn",
  "numpy",
  "xgboost",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "model"]
